<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TVTC | Family Assessment</title><style>:root{--g:#08734d;--d:#064b35;--lime:#c8ed71;--bg:#f1f7f3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#15372b;font-family:Arial,'Segoe UI',sans-serif}.top{background:linear-gradient(115deg,#064b35,#07885c);color:white;padding:22px 5%;border-bottom:6px solid #a4d855}.brand{font-size:14px;opacity:.9}.top h1{margin:9px 0;font-size:clamp(25px,4vw,39px)}.wrap{max-width:1050px;margin:25px auto;padding:0 16px}.panel{background:white;border:1px solid #d9e9dc;border-radius:20px;padding:25px;box-shadow:0 8px 24px #063c2410}.intro{text-align:center;padding:25px}.intro h2{font-size:27px}.intro p{line-height:1.8}.fields{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin:22px 0}input,select{font:inherit;padding:13px;border:2px solid #b6d5c0;border-radius:10px;min-width:220px}button{font:inherit;cursor:pointer;border:0;border-radius:11px;padding:12px 22px;font-weight:700}.primary{background:var(--g);color:white}.secondary{background:#e8f5eb;color:var(--d)}button:disabled{opacity:.45;cursor:not-allowed}.meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:15px;font-weight:700}.track{height:11px;background:#e0ede5;border-radius:30px;overflow:hidden;margin-bottom:24px}.fill{height:100%;background:#16a36b;transition:width .2s}.question{margin:0 0 18px;font-size:clamp(22px,3vw,29px)}.hint{color:#60796c;margin-bottom:20px}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.opt{background:#f8fcf9;border:2px solid #d9e7dd;text-align:left;padding:17px;font-size:19px;font-weight:600}.opt.chosen{border-color:#08734d;background:#e3f6e9}.photo-frame{width:240px;height:230px;max-width:100%;margin:0 auto 20px;border-radius:18px;overflow:hidden;background:#e9f2ec;display:flex;align-items:center;justify-content:center;text-align:center;color:#4d6b58}.photo-frame img{width:100%;height:100%;object-fit:cover;object-position:center 35%}.spelling{font-size:39px;letter-spacing:4px;text-align:center;font-weight:800;color:#075b3e;margin:22px}.answer{display:block;margin:10px auto 20px;text-align:center;width:min(300px,100%);font-size:24px}.tokens,.built{display:flex;flex-wrap:wrap;gap:9px;min-height:55px;padding:12px;border:2px dashed #b6d5c0;border-radius:12px;margin:13px 0}.token{background:#e8f5e8;border:1px solid #a9d1b5;color:#084d36}.built .token{background:#d2eecf}.controls{display:flex;justify-content:space-between;gap:10px;margin-top:28px}.notice{color:#9b4e00;font-size:14px;margin-top:10px}.score{font-size:54px;color:var(--g);font-weight:800}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:20px 0}.stat{background:#eef7ef;padding:16px;border-radius:12px}.review{padding:10px;border-bottom:1px solid #e0e9e2}.good{color:#08734d}.bad{color:#a83b38}@media(max-width:600px){.options{grid-template-columns:1fr}.panel{padding:18px}.top{padding:20px}.spelling{font-size:32px}}@media print{.top,.controls,.no-print{display:none!important}.panel{box-shadow:none}}.tree-help{background:#edf7ed;border-left:4px solid #0a8059;padding:12px 15px;border-radius:10px;line-height:1.7;margin:15px 0;font-size:15px}.tree{padding:14px;background:#f9fcf8;border:1px solid #c9dfd1;border-radius:16px;margin:12px 0 20px}.tree-row{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.family-person{min-width:115px;text-align:center;padding:10px;border:2px solid #d5e4db;border-radius:13px;background:white;display:flex;align-items:center;flex-direction:column;gap:4px}.family-person span{font-size:11px;color:#607568}.family-person.active-person{border:3px solid #078657;background:#e0f9e9;box-shadow:0 0 0 3px #c8efd8}.family-person.reference{border-color:#efba40}.avatar{width:44px;height:44px;border-radius:50%;background:#d4eee0;display:grid;place-items:center;font-size:22px;font-weight:800;color:#07553b}.tree-connector{text-align:center;color:#08734d;font-size:25px;line-height:30px}.active-person .avatar{background:#08734d;color:white}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}@media(max-width:550px){.family-person{min-width:80px;padding:6px}.family-person span{font-size:9px}.tree-row{gap:5px}.tree-help{font-size:13px}} </style><style>
.word-bank{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}.bank-word{background:#fff;border:2px solid #15875b;border-radius:12px;color:#064b35;font-size:17px;font-weight:700;padding:11px 15px;cursor:grab}.bank-word.selected{background:#d3f5a0;box-shadow:0 0 0 3px #79b832}.tree-help{font-size:17px;line-height:1.65}.tree-scroll{overflow-x:auto;padding:8px 0 20px}.book-tree{position:relative;min-width:780px;width:100%;aspect-ratio:1250/939;background:#fce6dd;border:2px solid #bad7c6;border-radius:15px;overflow:hidden}.book-tree img{width:100%;height:100%;display:block}.tree-slot{position:absolute;transform:translate(-50%,-50%);width:15%;min-height:51px;padding:3px 5px;border:2px dashed #0b704d;border-radius:9px;background:rgba(255,255,255,.96);cursor:pointer;box-shadow:0 2px 8px #0002}.tree-slot small{display:block;font-size:11px;color:#345e4d}.tree-slot strong{display:block;font-size:clamp(10px,1.25vw,15px);color:#064b35}.tree-slot.filled{background:#d9f6cb;border-style:solid}@media(max-width:700px){.tree-slot strong{font-size:12px}}
</style></head><body><header class="top"><div class="brand">Technical and Vocational Training Corporation • المؤسسة العامة للتدريب التقني والمهني</div><h1>Family & Grammar Assessment</h1><div>English Level 1 • 32 Questions • 8 Marks</div></header><main class="wrap"><div id="app"></div></main><script>
const questions=[];function add(section,type,prompt,answer,extra={}){questions.push({section,type,prompt,answer,...extra})}
const family=[
{name:'Mohammed',answer:'grandfather',x:35,y:22},
{name:'Rabiya',answer:'grandmother',x:54,y:22},
{name:'Barak',answer:'uncle',x:13,y:61},
{name:'Aaliyah',answer:'aunt',x:30,y:61},
{name:'Habiba',answer:'mother',x:58,y:61},
{name:'Mostafa',answer:'father',x:78,y:61},
{name:'Ayesha',answer:'sister',x:68,y:91},
{name:'Ali',answer:'brother',x:87,y:91}
];
family.forEach((person,i)=>add('Complete the Family Tree','tree','Drag the correct family word to its place.',person.answer,{target:i}));
let selectedFamilyWord='';
function treeHTML(){
 const bank=['grandfather','grandmother','father','mother','uncle','aunt','brother','sister'];
 return `<p class="tree-help"><b>Look at Khaled.</b> Complete the family tree using the words below. Drag a word to a blank box, or tap a word and then tap a box. <b>Basim is Khaled’s cousin</b> (example).</p>
 <div class="word-bank">${bank.map(w=>`<button type="button" class="bank-word ${selectedFamilyWord===w?'selected':''}" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${w}')" onclick="selectedFamilyWord='${w}';render()">${w}</button>`).join('')}</div>
 <div class="tree-scroll"><div class="book-tree"><img src="book_family_tree.jpg" alt="The original family tree from the textbook, with Mohammed, Rabiya, Barak, Aaliyah, Habiba, Mostafa, Basim, Khaled, Ayesha and Ali" />${family.map((p,i)=>`<button type="button" class="tree-slot ${answers[i]?'filled':''}" style="left:${p.x}%;top:${p.y}%" ondragover="event.preventDefault()" ondrop="event.preventDefault();setFamily(${i},event.dataTransfer.getData('text/plain'))" onclick="setFamily(${i},selectedFamilyWord)" aria-label="Family relationship for ${p.name}"><small>${p.name}</small><strong>${esc(answers[i]||'Drop word here')}</strong></button>`).join('')}</div></div>
 <p class="hint">${family.filter((p,i)=>answers[i]).length} / 8 completed. You can replace a word at any time.</p>`
}
function setFamily(i,w){if(!family.some(p=>p.answer===w))return;answers[i]=w;selectedFamilyWord='';render()}
[['br_ther','brother'],['s_ster','sister'],['a_nt','aunt'],['cous_n','cousin']].forEach(([mask,ans])=>add('Spelling','spell','Look at the incomplete word. Write the FULL word.',ans,{mask}));
[['I ___ two brothers.','have',['have','has','having']],['She ___ one sister.','has',['have','has','having']],['My father ___ a brother.','has',['have','has','having']]].forEach(x=>add('Have / Has','choice',x[0],x[1],{choices:x[2]}));
[['I ___ have a sister.','don’t',['don’t','doesn’t','isn’t']],['He ___ have a brother.','doesn’t',['don’t','doesn’t','hasn’t']],['___ she have an aunt?','Does',['Do','Does','Has']],['___ you have a cousin?','Do',['Do','Does','Are']]].forEach(x=>add('Negatives & Questions','choice',x[0],x[1],{choices:x[2]}));
[['Do you have ___ cousins?','any',['any','a lot','an']],['She doesn’t have ___ sisters.','any',['any','a lot of','a']],['He has ___ uncles.','lots of',['any','lots of','lot']]].forEach(x=>add('Quantifiers','choice',x[0],x[1],{choices:x[2]}));
[['How many brothers do you have?','I have two brothers.',['My uncle is Ali.','I have two brothers.','He is my father.']],['Who is your uncle?','Ali is my uncle.',['I have three uncles.','Ali is my uncle.','I have one brother.']],['How many sisters does Sara have?','She has one sister.',['Ayesha is her sister.','She has one sister.','Her sister is Sara.']]].forEach(x=>add('Question Words','choice',x[0],x[1],{choices:x[2]}));
[['She','has','two','brothers.'],['Does','he','have','a','sister?'],['I','don’t','have','any','cousins.']].forEach(words=>add('Sentence Building','order','Tap the mixed-up words in the correct order.',words.join(' '),{words,displayOrder:words.map((_,i)=>i).reverse()}));
[['mother',['mother','brother','cousin']],['uncle',['aunt','uncle','sister']],['grandmother',['grandfather','grandmother','mother']],['sister',['sister','cousin','father']]].forEach(x=>add('Listening','listen','Listen and choose the word you hear.',x[0],{choices:x[1]}));
let current=0,answers={},order=[],name='',group='';const app=document.getElementById('app');function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function photo(url){return `<div class="photo-frame"><img src="${url}" alt="Photograph of a family member" loading="eager" onerror="this.style.display='none';this.parentElement.innerHTML='<p>Photo unavailable. Read the family clue.</p>'"></div>`}
function start(){name=document.getElementById('name').value.trim();group=document.getElementById('group').value.trim();if(!name||!group){alert('Please enter your name and group.');return}current=0;render()}function intro(){app.innerHTML=`<div class="panel intro"><h2>Welcome to your English Quiz</h2><p>Answer 32 questions. Each correct answer earns <b>0.25 marks</b>.<br>Read carefully, listen to the audio, and check your answers before submitting. Use the textbook family tree to identify relationships.</p><div class="fields"><input id="name" placeholder="Student full name" autocomplete="name"/><input id="group" placeholder="Group / المجموعة"/></div><button class="primary" onclick="start()">Start Assessment →</button><p class="hint">Trainer: ADEL ALSMAEEL • Level 1</p></div>`}function choose(v){answers[current]=v;render()}function render(){const q=questions[current],v=answers[current];order=Array.isArray(v)?v:[];let content='';if(q.type==='tree')content=treeHTML();if(q.photo)content=photo(q.photo);if(q.type==='spell')content+=`<div class="spelling">${esc(q.mask)}</div><input class="answer" maxlength="24" autocomplete="off" spellcheck="false" placeholder="Type the complete word" value="${esc(v||'')}" oninput="answers[current]=this.value.trim().toLowerCase()"/>`;if(q.type==='choice'||q.type==='picture'||q.type==='listen')content+=`<div class="options">${q.choices.map(c=>`<button class="opt ${v===c?'chosen':''}" onclick='choose(${JSON.stringify(c)})'>${esc(c)}</button>`).join('')}</div>`;if(q.type==='listen')content=`<button class="primary" onclick="speak()">🔊 Play Audio</button><p class="hint">You can replay the audio.</p>`+content;if(q.type==='order'){let used=Array.isArray(v)?v:[];content=`<div class="built">${used.map((x,i)=>`<button class="token" onclick="removeToken(${i})">${esc(x.word)} ×</button>`).join('')||'<span class="hint">Your sentence appears here</span>'}</div><p class="hint">The words are mixed. Build the sentence from the first word to the last.</p><div class="tokens">${q.displayOrder.map(i=>({w:q.words[i],i})).map(({w,i})=>used.some(x=>x.i===i)?'':`<button class="token" onclick="addToken(${i})">${esc(w)}</button>`).join('')}</div><button class="secondary" onclick="answers[current]=[];render()">Clear sentence</button>`}app.innerHTML=`<div class="meta"><span>${esc(name)} · ${esc(group)}</span><span>Question ${current<8?'1–8':current+1} / 32 · ${current<8?'2 marks (8 words)':'0.25 mark'}</span></div><div class="track"><div class="fill" style="width:${(current+1)/32*100}%"></div></div><section class="panel"><div class="hint">${esc(q.section)}</div><h2 class="question">${current<8?'1–8.':current+1+'.'} ${esc(q.prompt)}</h2>${content}<div class="controls"><button class="secondary" ${current===0?'disabled':''} onclick="current=current===8?0:current-1;render()">← Previous</button><button class="primary" onclick="next()">${current===31?'Submit Quiz':'Next →'}</button></div><p class="notice">You may return to earlier questions before submission.</p></section>`}function addToken(i){let a=answers[current]||[];a.push({i,word:questions[current].words[i]});answers[current]=a;render()}function removeToken(i){answers[current].splice(i,1);render()}function speak(){if(!('speechSynthesis'in window)){alert('Audio is not supported in this browser. Try Chrome or Edge.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(questions[current].answer);u.lang='en-US';u.rate=.78;speechSynthesis.speak(u)}function next(){if(current<31){current=current<8?8:current+1;render();return}let missing=questions.filter((q,i)=>answers[i]===undefined||answers[i]===''||(Array.isArray(answers[i])&&!answers[i].length)).length;if(missing&&!confirm(`You have ${missing} unanswered question(s). Submit anyway?`))return;results()}function correct(q,v){return (q.type==='order'?Array.isArray(v)?v.map(x=>x.word).join(' '):'':String(v||'')).toLowerCase().replace(/[’]/g,"'").trim()===q.answer.toLowerCase().replace(/[’]/g,"'").trim()}function results(){let n=questions.filter((q,i)=>correct(q,answers[i])).length;let sections=[...new Set(questions.map(q=>q.section))];app.innerHTML=`<section class="panel"><h2>Assessment Result</h2><p><b>${esc(name)}</b> · Group: ${esc(group)}</p><div class="score">${(n*.25).toFixed(2)} / 8</div><p>${n} correct out of 32 questions</p><div class="summary">${sections.map(s=>{let ids=questions.map((q,i)=>q.section===s?i:-1).filter(i=>i>=0),c=ids.filter(i=>correct(questions[i],answers[i])).length;return `<div class="stat"><b>${esc(s)}</b><p>${c} / ${ids.length}</p></div>`}).join('')}</div><h3>Answer Review</h3>${questions.map((q,i)=>`<div class="review"><b class="${correct(q,answers[i])?'good':'bad'}">${i+1}. ${correct(q,answers[i])?'✓':'✗'}</b> ${esc(q.prompt)} <div class="hint">Correct answer: ${esc(q.answer)}</div></div>`).join('')}<div class="controls no-print"><button class="secondary" onclick="window.print()">Print Result</button><button class="primary" onclick="location.reload()">Start Again</button></div></section>`}intro();
</script></body></html>
